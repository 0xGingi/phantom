name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 2.1.0). Leave empty to use Cargo.toml."
        required: false
        type: string

permissions:
  contents: write

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.check.outputs.should_release }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check version bump
        id: check
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            manual_version="${{ inputs.version }}"
            if [[ -n "$manual_version" ]]; then
              echo "should_release=true" >> "$GITHUB_OUTPUT"
              echo "version=$manual_version" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            current_version=$(grep -E '^\s*version\s*=' Cargo.toml | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
            if [[ -z "$current_version" ]]; then
              echo "should_release=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "version=$current_version" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! git diff --name-only HEAD^ HEAD | grep -q "^Cargo.toml$"; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          current_version=$(grep -E '^\s*version\s*=' Cargo.toml | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
          previous_version=$(git show HEAD^:Cargo.toml | grep -E '^\s*version\s*=' | head -1 | sed -E 's/.*"([^"]+)".*/\1/')

          if [[ -z "$current_version" || -z "$previous_version" ]]; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "$current_version" == "$previous_version" ]]; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "should_release=true" >> "$GITHUB_OUTPUT"
          echo "version=$current_version" >> "$GITHUB_OUTPUT"

  build-linux:
    needs: check-version
    if: needs.check-version.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build
        run: cargo build --release

      - name: Package
        run: |
          mkdir -p dist
          cp target/release/phantom dist/phantom-linux-x64

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: phantom-linux-x64
          path: dist/phantom-linux-x64

  build-macos:
    needs: check-version
    if: needs.check-version.outputs.should_release == 'true'
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build
        run: cargo build --release

      - name: Package
        run: |
          mkdir -p dist
          cp target/release/phantom dist/phantom-macos-arm64

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: phantom-macos-arm64
          path: dist/phantom-macos-arm64

  release:
    needs: [check-version, build-linux, build-macos]
    if: needs.check-version.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Download linux artifact
        uses: actions/download-artifact@v4
        with:
          name: phantom-linux-x64
          path: dist

      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: phantom-macos-arm64
          path: dist

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.check-version.outputs.version }}
          name: v${{ needs.check-version.outputs.version }}
          files: |
            dist/phantom-linux-x64
            dist/phantom-macos-arm64
